.debug-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:14px}

.steps{margin-top:12px;display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:12px;padding:0 0 17px;position:relative}
.step:before{content:"";position:absolute;left:9px;top:20px;bottom:0;border-left:1px solid #e3edf4}

.step strong{font-size:11px;font-weight:500;display:block}
.step small{font-size:10px;color:#6e879b;line-height:1.7;display:block;margin-top:5px}
.modal-layer{position:absolute;top:0;right:0;bottom:0;left:0;z-index:10;background:var(--scrim);display:flex;align-items:flex-end;padding:0}
[hidden]{display:none!important}
.modal{width:100%;max-height:85%;overflow:auto;background:var(--bg);color:var(--ink);border-radius:22px 22px 0 0;padding:18px 17px 20px;padding-bottom:max(20px,env(safe-area-inset-bottom));box-shadow:0 -7px 38px #162e2826}

.diagnostic-file{display:flex;flex-direction:column;gap:4px;margin:12px 0}
.diagnostic-file span{font-size:12px;color:var(--muted)}
.diagnostic-file strong{font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.diagnostic-progress{display:block;width:100%;height:8px;margin:16px 0 6px;accent-color:var(--accent)}
.config-backup-panel>.modal-actions:first-child{margin-top:0}
.key-availability #homeKeyPause + .st-cell{border-top:1px solid var(--line)}
.vh-status .vh-parts{align-items:center;justify-content:flex-start;text-align:left}

.toast{position:absolute;z-index:20;left:50%;bottom:76px;transform:translateX(-50%);padding:9px 15px;border:1px solid var(--muted);border-radius:11px;max-width:90%;width:max-content;background:var(--ink);color:var(--surface);font-size:13px;text-align:center;line-height:1.45;box-shadow:0 3px 16px #17352823;pointer-events:none}
.timeline-time{font-size:10px;color:#6e879b;margin-bottom:12px}

.widget-buttons{display:flex;gap:8px;margin-top:16px}

.release-settings{text-align:center;margin:12px 0}
.close-review{display:none}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding:12px 0}
.detail-grid span{font-size:10px;color:#6e879b}
.detail-grid b{display:block;color:#385d78;font-size:12px;margin-top:5px;font-weight:500}
.explanation{margin-top:12px;border-top:1px solid #e2ebf1;color:#607b8f;font-size:11px;line-height:1.8}
.explanation>summary{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:42px;padding:0 2px;list-style:none;cursor:pointer;color:#4c728b;border-radius:4px}
.explanation>summary::-webkit-details-marker{display:none}
.explanation>summary::marker{content:""}
.explanation>summary:after{content:"+";font-size:17px;line-height:1;color:#7698ad}
.explanation[open]>summary:after{content:"−"}
.explanation>summary:focus-visible{outline:3px solid #30a2d2;outline-offset:2px}
.explanation>div{padding:0 2px 10px;overflow-wrap:anywhere}
.explanation p{font-size:11px;line-height:1.8;margin-top:8px;color:inherit}
.explanation p:first-child{margin-top:0}
.explanation ul,.explanation ol{margin:8px 0;padding-left:20px}

/* Observation panels share the same light surface and blue/cyan data language. */
.telemetry-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}

.telemetry-grid.three,.telemetry-grid[data-columns="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}

.telemetry-grid>div,.telemetry-grid>article{min-width:0;padding:12px 11px;border:1px solid #dbe8ef;border-radius:10px;background:#f8fcff;overflow-wrap:anywhere}

.telemetry-grid .label,.telemetry-grid small{display:block;color:#698396;font-size:10px;line-height:1.6}

.telemetry-value{display:block;margin:7px 0 3px;font-size:23px;font-weight:550;letter-spacing:-.7px;line-height:1.25;color:#176f9c;font-variant-numeric:tabular-nums}

.telemetry-value small,.telemetry-value .unit{display:inline;font-size:10px;font-weight:400;letter-spacing:0;margin-left:3px;color:#698396}

.telemetry-chart{height:108px;margin:12px 0 6px;border:1px solid #dceaf2;border-radius:8px;overflow:hidden;background-color:#fbfdff;background-image:linear-gradient(#e1edf4 1px,transparent 1px),linear-gradient(90deg,#e1edf4 1px,transparent 1px);background-size:100% 27px,34px 100%}

.telemetry-chart svg{display:block;width:100%;height:100%}

.sensor-state{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid #d5e8ef;border-radius:6px;background:#edf7fa;color:#34778f;font-size:10px;line-height:1.5}

.sensor-state:before{content:"";width:5px;height:5px;flex-shrink:0;border-radius:50%;background:#2199ac}

.sensor-state.warn,.sensor-state.warning{background:#fff7e8;border-color:#efdfbb;color:#8e681f}

.sensor-state.warn:before,.sensor-state.warning:before{background:#c28b2c}

.sensor-state.off,.sensor-state.unknown{background:#f0f4f7;border-color:#dce5ec;color:#718898}

.sensor-state.off:before,.sensor-state.unknown:before{background:#9aaeba}

.observation-list{margin-top:12px;border:1px solid #dce7ef;border-radius:12px;background:#fff;overflow:hidden}

.observation-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 13px;min-width:0;font-size:11px;line-height:1.7;color:#647e91}

.observation-row+.observation-row{border-top:1px solid #e8eff4}

.observation-row>span:first-child{flex:1;min-width:0}

.observation-row b,.observation-row strong{color:#2a5977;font-size:11px;font-weight:550;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

.observation-row small{display:block;color:#7b91a1;font-size:10px;line-height:1.7}

.debug-entry{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:54px;margin-top:12px;padding:12px 14px;text-align:left;border:1px solid #cce2ed;border-radius:12px;background:linear-gradient(110deg,#f4fbff,#edf6fa);color:#246d94;font-size:12px}

.debug-entry>.icon{color:#158fba}

.debug-entry strong{display:block;font-size:12px;font-weight:550}

.debug-entry small{display:block;margin-top:4px;color:#68899b;font-size:10px;line-height:1.6}



.restart-screen{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:15px;padding:30px;text-align:center;background:#f7fbfe;color:#285875}

.restart-screen h3,.restart-screen strong{font-size:18px;font-weight:550;letter-spacing:.2px}

.restart-screen p,.restart-screen small{font-size:12px;line-height:1.8;color:#71899b}

.restart-spinner{width:36px;height:36px;border:2px solid #d9e9f2;border-top-color:#0986bd;border-right-color:#60b9d3;border-radius:50%;animation:restart-turn .9s linear infinite}

@keyframes restart-turn{to{transform:rotate(360deg)}
}

/* Existing inline SVG diagrams retain their geometry with the revised theme. */
.car-diagram svg g{stroke:#8eafc2}

.car-diagram svg path[fill="#eef3e5"]{fill:#e9f4fa}

.car-diagram svg path[fill="#d9e6cb"]{fill:#cee6f1}

.trace-chart svg>path:last-child{stroke:#0989b5}

/* Manual vehicle controls share the daily-use surfaces and connection header. */
.header-connectivity::before{content:"";position:absolute;top:4px;bottom:4px;left:0;right:0;z-index:-1;border:1px solid var(--line);border-radius:19px;background:var(--surface)}
.header-connectivity{position:relative;display:flex;align-items:center;flex:none;isolation:isolate}
.connection-icon{position:relative;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;min-height:44px;padding:0;border:0;border-radius:15px;background:transparent;color:var(--muted);flex:none}
.connection-icon .icon{width:21px;height:21px;stroke-width:1.8}
.connection-icon[data-state="ready"],.connection-icon[data-state="connected"]{color:var(--status)}
.connection-icon[data-state="disconnected"],.connection-icon[data-state="offline"],.connection-icon[data-state="expired"]{color:var(--muted)}
.connection-dot{position:absolute;left:26px;top:22px;width:9px;height:9px;border-radius:50%;background:currentColor;border:1px solid var(--surface);font-size:7px;font-weight:700;line-height:1}
.connection-icon[data-state="disconnected"] .connection-dot,.connection-icon[data-state="offline"] .connection-dot,.connection-icon[data-state="expired"] .connection-dot{border-radius:1px}
.connection-icon[data-state="unknown"] .connection-dot{background:transparent;border:1px solid currentColor;border-radius:50%}

.plan-card{padding:15px;border:1px solid #d8e7ef;border-radius:14px;background:#fff;margin-top:11px}

.plan-days{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;color:#6d8597;font-size:10px;line-height:1.7}

.plan-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:10px;border-top:1px solid #e7eff4}

.plan-toolbar button{flex-shrink:0}
.weekday-picker{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px}

.weekday-picker input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}

.control-result strong{display:block;font-size:12px;font-weight:600}
.control-result small{display:block;font-size:10px;color:inherit;margin-top:3px}
.control-result.amber,.control-result[data-status="blocked"],.control-result[data-status="send-failed"],.control-result[data-status="unconfirmed"]{background:#fff8ea;border-color:#eddfbf;color:#8a641e}

/* Native WiFi candidates remain separate from the editable rule fields. */
.wifi-picker{margin-bottom:15px;padding:13px;background:#f4faff;border:1px solid #d6e6ef;border-radius:14px}.wifi-picker h3{margin:0}.wifi-option{display:flex;align-items:center;gap:10px;width:100%;padding:10px;margin-top:7px;text-align:left;border:1px solid #dce7ee;border-radius:10px;background:#fff;color:var(--ink);min-width:0}.wifi-option .copy{flex:1;min-width:0;overflow-wrap:anywhere}.wifi-option .copy strong,.wifi-option .copy small{display:block}.wifi-option .copy small{color:var(--muted);margin-top:3px;font-size:11px}.wifi-option.selected{border-color:#0788bf;background:#edf8ff}.wifi-nearby{margin-top:12px;max-height:230px;overflow:auto}.wifi-picker-actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}.wifi-picker .form-error{margin-top:10px;font-size:12px;overflow-wrap:anywhere}
